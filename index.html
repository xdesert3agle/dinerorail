<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Color de la barra del navegador en móvil: App.tsx lo cambia al fondo del tema activo. -->
    <meta name="theme-color" content="#0f0708" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Fuente de los títulos del tema Aha (el de partida): precargada para que no salten al cargar. -->
    <link rel="preload" href="/src/assets/fonts/card-characters.ttf" as="font" type="font/ttf" crossorigin />
    <!-- Fuentes de los temas (Aha: Figtree; Grafito; Sparxie): el navegador solo descarga las que usa el tema activo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@500&family=Source+Code+Pro:wght@400;500&family=Instrument+Serif&family=Pixelify+Sans:wght@400;600&family=VT323&family=Courier+Prime:wght@400;700&display=swap"
    />
    <title>Dinero Rail</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
